<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sky mood</title>
  <meta name="description" content="A little scent, a little softness, a better mood.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">sky mood</a>
      <nav class="site-nav">
        <a href="index.html" aria-current="page">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container">
        <h1>ให้ทุกวันของคุณ มีอารมณ์ที่สวยงามในแบบของตัวเอง</h1>
        <p class="tagline-en">A little scent, a little softness, a better mood.</p>
        <a class="btn" href="product.html">ดูสินค้าทั้งหมด</a>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="section-head">
          <h2>เลือกอารมณ์ของคุณ</h2>
        </div>
        <div class="grid">
          <a class="card mood-card" href="product.html?mood=fresh">
            <h3><span class="mood-dot mood-dot--fresh"></span>Fresh</h3>
            <span class="mood-rule mood-rule--fresh"></span>
            <p>สะอาด สดชื่น เริ่มต้นวันได้เบาสบาย</p>
          </a>
          <a class="card mood-card" href="product.html?mood=sweet">
            <h3><span class="mood-dot mood-dot--sweet"></span>Sweet</h3>
            <span class="mood-rule mood-rule--sweet"></span>
            <p>หอมนุ่มละมุน ผ่อนคลายหลังจบวัน</p>
          </a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">sky mood</div>
  </footer>
</body>
</html>

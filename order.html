<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อ | sky mood</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">sky mood</a>
      <nav class="site-nav">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <div class="section-head">
        <h1>สั่งซื้อสินค้า</h1>
        <p class="muted">กรอกข้อมูลด้านล่าง เราจะติดต่อกลับเพื่อยืนยันคำสั่งซื้อ</p>
      </div>

      <form id="orderForm">
        <div class="field">
          <label for="customerName">ชื่อลูกค้า</label>
          <input type="text" id="customerName" name="customerName" required autocomplete="name">
        </div>
        <div class="field">
          <label for="contact">เบอร์โทร / Line</label>
          <input type="text" id="contact" name="contact" required>
        </div>
        <div class="field">
          <label for="items">รายการสินค้า</label>
          <input type="text" id="items" name="items" required>
        </div>
        <div class="field">
          <label for="total">จำนวนเงินรวม (บาท)</label>
          <input type="number" id="total" name="total" min="0" required>
        </div>
        <div class="field">
          <label for="note">หมายเหตุ</label>
          <textarea id="note" name="note"></textarea>
        </div>
        <button type="submit">ยืนยันสั่งซื้อ</button>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">sky mood</div>
  </footer>
  <script src="script.js"></script>
</body>
</html>
